<svg xmlns="http://www.w3.org/2000/svg" width="560" height="372" viewBox="0 0 560 372" role="img" aria-labelledby="title desc">
  <title id="title">같은 키로 두 번 부르면</title>
  <desc id="desc">컴포넌트 A가 0초에 ['user', 1]을 부르고 B가 0.5초에 같은 키로 불러요. 네트워크 요청은 ① 하나만 나가고, 1.5초에 온 응답을 A와 B가 같이 받아요. switchMap이나 takeLatest라면 ①을 끊고 ②를 새로 보내요.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#3182f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #191f28; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #6b7684; }
    .head { font-size: 13px; font-weight: 600; fill: #3182f6; }
    .head-grey { font-size: 13px; font-weight: 600; fill: #6b7684; }
    .lane { font-size: 13px; font-weight: 500; fill: #4e5968; }
    .small { font-size: 12px; fill: #8b95a1; }
    .accent { font-size: 12px; font-weight: 600; fill: #1b64da; }
    .bar { fill: #e8f3ff; stroke: #3182f6; }
    .bar-text { font-size: 12px; font-weight: 600; fill: #1b64da; }
    .cut { fill: #fdecee; stroke: #f04452; }
    .cut-text { font-size: 12px; font-weight: 600; fill: #d91a2a; }
    .tick { font-size: 12px; fill: #8b95a1; text-anchor: middle; }
  </style>

  <rect width="560" height="372" rx="16" fill="#fff" />
  <text class="title" x="24" y="38">같은 키로 두 번 부르면</text>
  <text class="sub" x="24" y="62">요청은 하나만 나가고, 온 응답을 같이 받아요</text>

  <g stroke="#f2f4f6">
    <line x1="140" y1="84" x2="140" y2="324" />
    <line x1="235" y1="84" x2="235" y2="324" />
    <line x1="330" y1="84" x2="330" y2="324" />
    <line x1="425" y1="84" x2="425" y2="324" />
    <line x1="520" y1="84" x2="520" y2="324" />
  </g>

  <text class="head" x="24" y="100">TanStack Query · 같은 queryKey</text>

  <text class="lane" x="24" y="134">컴포넌트 A</text>
  <line x1="140" y1="130" x2="425" y2="130" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3 4" />
  <circle cx="140" cy="130" r="5" fill="#3182f6" />
  <circle cx="425" cy="130" r="5" fill="#3182f6" />
  <text class="small" x="150" y="122">0초에 부름</text>
  <text class="accent" x="435" y="134">① 받음</text>

  <text class="lane" x="24" y="174">컴포넌트 B</text>
  <line x1="235" y1="170" x2="425" y2="170" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3 4" />
  <circle cx="235" cy="170" r="5" fill="#3182f6" />
  <circle cx="425" cy="170" r="5" fill="#3182f6" />
  <text class="small" x="245" y="162">0.5초에 부름</text>
  <text class="accent" x="435" y="174">① 받음</text>
  <text class="small" x="435" y="154">같은 data</text>

  <text class="lane" x="24" y="220">네트워크</text>
  <rect class="bar" x="140" y="202" width="285" height="28" rx="8" />
  <text class="bar-text code" x="152" y="220">① GET /api/user/1</text>

  <g stroke="#3182f6" stroke-width="1.5" fill="none">
    <line x1="140" y1="136" x2="140" y2="198" marker-end="url(#arrow)" />
    <line x1="235" y1="176" x2="235" y2="198" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <line x1="425" y1="200" x2="425" y2="178" marker-end="url(#arrow)" />
    <line x1="425" y1="162" x2="425" y2="138" marker-end="url(#arrow)" />
  </g>
  <text class="accent" x="243" y="193">합류 · 새 요청 없음</text>

  <text class="head-grey" x="24" y="266">비교 · switchMap, takeLatest라면</text>
  <text class="lane" x="24" y="300">네트워크</text>
  <rect class="cut" x="140" y="282" width="93" height="28" rx="8" />
  <text class="cut-text" x="150" y="300">① 끊음</text>
  <rect class="bar" x="237" y="282" width="283" height="28" rx="8" />
  <text class="bar-text" x="249" y="300">② 새로 보냄</text>

  <line x1="140" y1="334" x2="520" y2="334" stroke="#d1d6db" />
  <text class="tick" x="140" y="354">0초</text>
  <text class="tick" x="235" y="354">0.5</text>
  <text class="tick" x="330" y="354">1.0</text>
  <text class="tick" x="425" y="354">1.5</text>
  <text class="tick" x="520" y="354">2.0초</text>
</svg>
