<svg xmlns="http://www.w3.org/2000/svg" width="560" height="398" viewBox="0 0 560 398" role="img" aria-labelledby="title desc">
  <title id="title">같은 저장을 single-flight로 감싸면</title>
  <desc id="desc">PUT을 0초와 0.5초에 두 번 보내요. 키가 같으면 두 번째는 ①에 합류해서 요청은 하나만 나가고 둘 다 ① 응답을 받아요. 값이 달라 키가 다르면 ①과 ②가 따로 나가요.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#3182f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #191f28; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #6b7684; }
    .head { font-size: 13px; font-weight: 600; fill: #3182f6; }
    .head-grey { font-size: 13px; font-weight: 600; fill: #6b7684; }
    .lane { font-size: 13px; font-weight: 500; fill: #4e5968; }
    .small { font-size: 12px; fill: #8b95a1; }
    .accent { font-size: 12px; font-weight: 600; fill: #1b64da; }
    .bar { fill: #e8f3ff; stroke: #3182f6; }
    .bar-text { font-size: 12px; font-weight: 600; fill: #1b64da; }
    .tick { font-size: 12px; fill: #8b95a1; text-anchor: middle; }
  </style>

  <rect width="560" height="398" rx="16" fill="#fff" />
  <text class="title" x="24" y="38">같은 저장을 single-flight로 감싸면</text>
  <text class="sub" x="24" y="62">키가 같으면 요청 하나를 같이 써요. useMutation만으로는 둘 다 나가요</text>

  <g stroke="#f2f4f6">
    <line x1="140" y1="84" x2="140" y2="350" />
    <line x1="235" y1="84" x2="235" y2="350" />
    <line x1="330" y1="84" x2="330" y2="350" />
    <line x1="425" y1="84" x2="425" y2="350" />
    <line x1="520" y1="84" x2="520" y2="350" />
  </g>

  <text class="head" x="24" y="100">키가 같아요 · <tspan class="code">PUT /api/user/1 {"name":"원티드"}</tspan></text>

  <text class="lane code" x="24" y="134">mutate ①</text>
  <line x1="140" y1="130" x2="425" y2="130" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3 4" />
  <circle cx="140" cy="130" r="5" fill="#3182f6" />
  <circle cx="425" cy="130" r="5" fill="#3182f6" />
  <text class="accent" x="435" y="134">① 응답</text>

  <text class="lane code" x="24" y="174">mutate ②</text>
  <line x1="235" y1="170" x2="425" y2="170" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3 4" />
  <circle cx="235" cy="170" r="5" fill="#3182f6" />
  <circle cx="425" cy="170" r="5" fill="#3182f6" />
  <text class="small" x="245" y="162">0.5초에 같은 요청</text>
  <text class="accent" x="435" y="174">① 응답</text>
  <text class="small" x="435" y="154">같은 결과</text>

  <text class="lane" x="24" y="220">네트워크</text>
  <rect class="bar" x="140" y="202" width="285" height="28" rx="8" />
  <text class="bar-text code" x="152" y="220">① PUT /api/user/1</text>

  <g stroke="#3182f6" stroke-width="1.5" fill="none">
    <line x1="140" y1="136" x2="140" y2="198" marker-end="url(#arrow)" />
    <line x1="235" y1="176" x2="235" y2="198" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <line x1="425" y1="200" x2="425" y2="178" marker-end="url(#arrow)" />
    <line x1="425" y1="162" x2="425" y2="138" marker-end="url(#arrow)" />
  </g>
  <text class="accent" x="243" y="193">합류 · 같은 키라 새로 안 보내요</text>

  <text class="head-grey" x="24" y="266">키가 달라요 · 값이 다르거나 새 Idempotency-Key</text>
  <text class="lane" x="24" y="316">네트워크</text>
  <rect class="bar" x="140" y="280" width="285" height="26" rx="8" />
  <text class="bar-text code" x="152" y="297">① PUT {"name":"원티드"}</text>
  <rect class="bar" x="235" y="312" width="285" height="26" rx="8" />
  <text class="bar-text code" x="247" y="329">② PUT {"name":"원티드랩"}</text>

  <line x1="140" y1="360" x2="520" y2="360" stroke="#d1d6db" />
  <text class="tick" x="140" y="380">0초</text>
  <text class="tick" x="235" y="380">0.5</text>
  <text class="tick" x="330" y="380">1.0</text>
  <text class="tick" x="425" y="380">1.5</text>
  <text class="tick" x="520" y="380">2.0초</text>
</svg>
