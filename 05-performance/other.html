<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 아이콘이 없으면 브라우저가 /favicon.ico를 요청해서 404가 나요. 빈 아이콘으로 막아요. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <title>05 · 다른 페이지</title>
  </head>
  <body>
    <!-- bfcache와 Speculation Rules를 보려면 "다른 문서"로 이동해야 해서 만든 페이지예요. -->
    <header class="mx-auto flex h-14 max-w-[480px] items-center px-6">
      <span class="text-[15px] font-bold text-grey-900">Performance Lab</span>
    </header>
    <main class="mx-auto max-w-[480px] px-6 pt-5 pb-36">
      <span class="mb-4 grid size-16 place-items-center rounded-[22px] bg-grey-100 text-[34px]" aria-hidden="true">📄</span>
      <h1 id="title" class="text-[26px] leading-[1.4] font-bold tracking-[-0.02em] text-grey-900">다른 페이지에 왔어요</h1>
      <p id="description" class="mt-3 text-[17px] leading-[1.6] text-grey-600"></p>
      <output id="result" class="mt-8 block rounded-2xl bg-primary-weak px-5 py-4 text-[15px] leading-[1.6] font-medium text-primary-strong"></output>
    </main>
    <div class="fixed inset-x-0 bottom-0 bg-white px-6 pt-6 pb-[max(20px,env(safe-area-inset-bottom))]">
      <div class="mx-auto max-w-[432px]">
        <button
          id="back"
          class="h-14 w-full rounded-2xl bg-primary text-[17px] font-semibold text-white transition hover:bg-primary-strong active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          원래 화면으로 돌아가기
        </button>
      </div>
    </div>
    <script type="module" src="/src/other.ts"></script>
  </body>
</html>
